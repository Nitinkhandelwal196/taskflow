server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # In k8s, BACKEND_HOST resolves via a Kubernetes Service name (e.g. backend-svc).
    # For local docker-compose, this is overridden via env substitution or compose networking.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
