apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: taskflow
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          # Jenkins updates this tag in the GitOps repo after each build (e.g. via yq/sed + git commit)
          image: <YOUR_DOCKERHUB_USERNAME>/taskflow-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: postgres-svc
            - name: DB_PORT
              value: "5432"
            - name: REDIS_URL
              value: redis://redis-svc:6379
          envFrom:
            - secretRef: { name: postgres-secret }
          readinessProbe:
            httpGet: { path: /readyz, port: 5000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 5000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: taskflow
spec:
  selector: { app: backend }
  ports:
    - port: 5000
      targetPort: 5000
